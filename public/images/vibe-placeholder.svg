<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-label="Vibe artwork placeholder">
  <!-- Disc body -->
  <circle cx="80" cy="80" r="78" fill="url(#discBody)"/>
  <circle cx="80" cy="80" r="77" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <!-- Grooves -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <circle cx="80" cy="80" r="52" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="80" cy="80" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="80" cy="80" r="38" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="80" cy="80" r="29" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- Dial marker -->
  <path d="M80 30 L80 52" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center label -->
  <circle cx="80" cy="80" r="24" fill="rgba(255,255,255,0.05)"/>
  <circle cx="80" cy="80" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="80" cy="80" r="6" fill="rgba(255,255,255,0.65)"/>
  <!-- Subtle top sheen -->
  <ellipse cx="58" cy="46" rx="46" ry="30" fill="url(#sheen)" transform="rotate(-28 58 46)"/>
  <defs>
    <linearGradient id="discBody" x1="40" y1="24" x2="122" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2e45"/>
      <stop offset="0.5" stop-color="#171a2c"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
</svg>
